<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="AlgoFlow is an evidence-informed technical interview practice prototype with transparent learning metrics and exportable raw activity data.">
  <title>AlgoFlow — Evidence-informed interview practice</title>
  <link rel="stylesheet" href="styles.css?v=2.0.1">
  <script defer src="app-data.js?v=2.0.1"></script>
  <script defer src="app.js?v=2.0.1"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5H15v-6H9v6H3.5a.5.5 0 0 1-.5-.5z"/></symbol>
    <symbol id="i-path" viewBox="0 0 24 24"><circle cx="7" cy="5" r="2.5"/><circle cx="17" cy="19" r="2.5"/><path d="M7 7.5v2a3 3 0 0 0 3 3h4a3 3 0 0 1 3 3v1"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></symbol>
    <symbol id="i-journal" viewBox="0 0 24 24"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2zM5 17h14M9 7h6M9 11h6"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 5h5v15H4zM9 5h5v15H9zM14.5 4l4.5-1 3 15-4.5 1z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <a class="brand" href="#today" data-nav="today" aria-label="AlgoFlow home">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span><strong>AlgoFlow</strong><small>Practice with purpose</small></span>
      </a>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="sidebar-foot">
        <span class="data-badge"><span></span> Illustrative demo</span>
        <p>Learning activity is synthetic. Sources and formulas are traceable.</p>
        <button class="text-button" type="button" data-open-methodology>
          <svg aria-hidden="true"><use href="#i-info"></use></svg> Data &amp; methodology
        </button>
      </div>
    </aside>

    <div class="app-column">
      <header class="topbar">
        <div>
          <p class="eyebrow">Evidence-informed practice</p>
          <h1 id="page-title">Today</h1>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch color theme">
            <svg aria-hidden="true"><use href="#i-moon"></use></svg>
          </button>
          <button class="profile-button" type="button" data-open-methodology aria-label="Open data and methodology">
            <span class="avatar" aria-hidden="true">M</span>
            <span class="profile-copy"><strong>Demo learner</strong><small>Local prototype</small></span>
          </button>
        </div>
      </header>

      <main id="main-content" tabindex="-1"></main>
    </div>
  </div>

  <nav class="mobile-nav" id="mobile-nav" aria-label="Primary navigation"></nav>

  <dialog id="methodology-dialog" class="methodology-dialog" aria-labelledby="methodology-title">
    <div class="dialog-head">
      <div>
        <p class="eyebrow">Transparent by design</p>
        <h2 id="methodology-title">Data &amp; methodology</h2>
      </div>
      <button class="icon-button" type="button" data-close-dialog aria-label="Close dialog">
        <svg aria-hidden="true"><use href="#i-close"></use></svg>
      </button>
    </div>
    <div id="methodology-content" class="dialog-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
